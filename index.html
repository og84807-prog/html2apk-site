<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML2APK — Converta HTML em APK</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c10;
  --surface: #0e1419;
  --border: #1e2830;
  --border-hover: #2d3f50;
  --green: #00e676;
  --green-dim: #00e67622;
  --blue: #40c4ff;
  --orange: #ff9100;
  --red: #ff5252;
  --text: #cdd9e5;
  --text-dim: #546e7a;
  --text-bright: #e8f4fd;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grid background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.3;
  pointer-events: none;
  z-index: 0;
}

/* Glow orb */
body::after {
  content: '';
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, #00e67615 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 48px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 48px;
}

.logo {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -1px;
}
.logo .bracket { color: var(--text-dim); }
.logo .name { color: var(--green); }
.logo .arrow { color: var(--blue); }

.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  letter-spacing: 1px;
}

/* ── HERO ── */
.hero { text-align: center; margin-bottom: 52px; }
.hero h1 {
  font-size: clamp(32px, 6vw, 56px);
  font-weight: 800;
  color: var(--text-bright);
  line-height: 1.1;
  margin-bottom: 16px;
  letter-spacing: -2px;
}
.hero h1 span { color: var(--green); }
.hero p {
  color: var(--text-dim);
  font-size: 16px;
  font-weight: 400;
  max-width: 480px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ── CONFIG SECTION ── */
.config-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  margin-bottom: 16px;
  user-select: none;
}
.config-toggle span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.config-toggle .arrow-icon {
  color: var(--text-dim);
  transition: transform .2s;
  font-size: 10px;
}
.config-toggle.open .arrow-icon { transform: rotate(90deg); }

.config-panel {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 24px;
  gap: 16px;
  grid-template-columns: 1fr 1fr;
}
.config-panel.show { display: grid; }

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 20px;
  transition: border-color .2s;
}
.card:focus-within { border-color: var(--border-hover); }

.card-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--green);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-label::before {
  content: '';
  display: block;
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--green);
}

/* ── FIELD ── */
.field { margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }

label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

input[type="text"], input[type="password"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  color: var(--text-bright);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-dim);
}
input::placeholder { color: var(--text-dim); }

/* ── EDITOR ── */
.editor-wrap {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  transition: border-color .2s, box-shadow .2s;
}
.editor-wrap:focus-within {
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-dim);
}

.editor-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: #0a0f14;
  border-bottom: 1px solid var(--border);
}
.dot-r { width:10px;height:10px;border-radius:50%;background:#ff5f57; }
.dot-y { width:10px;height:10px;border-radius:50%;background:#febc2e; }
.dot-g { width:10px;height:10px;border-radius:50%;background:#28c840; }
.editor-filename {
  margin-left: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}

textarea {
  width: 100%;
  background: transparent;
  border: none;
  padding: 16px;
  color: #a8d8a8;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: vertical;
  min-height: 220px;
  outline: none;
  tab-size: 2;
}

/* ── BTN ── */
.btn-generate {
  width: 100%;
  background: var(--green);
  color: #020805;
  border: none;
  border-radius: 10px;
  padding: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .1s, box-shadow .2s, background .2s;
  margin-top: 8px;
  position: relative;
  overflow: hidden;
}
.btn-generate::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ffffff22, transparent);
}
.btn-generate:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px #00e67640;
}
.btn-generate:active { transform: translateY(0); }
.btn-generate:disabled {
  background: var(--border);
  color: var(--text-dim);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ── PROGRESS ── */
#progressCard { display: none; }
#progressCard.show { display: block; }

.steps { display: flex; flex-direction: column; gap: 8px; }

.step {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  transition: all .3s;
}
.step-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.step-text { flex: 1; }
.step-time { color: var(--text-dim); font-size: 11px; }

.step.wait { color: var(--text-dim); }
.step.active {
  border-color: var(--blue);
  color: var(--blue);
  background: #40c4ff08;
  animation: stepPulse 1.5s ease-in-out infinite;
}
.step.done {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-dim);
}
.step.error {
  border-color: var(--red);
  color: var(--red);
  background: #ff525208;
}

@keyframes stepPulse {
  0%,100% { box-shadow: 0 0 0 0 #40c4ff20; }
  50% { box-shadow: 0 0 0 6px #40c4ff00; }
}

/* ── LOG ── */
.log-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  max-height: 140px;
  overflow-y: auto;
  margin-top: 16px;
  line-height: 1.8;
}
.log-box .log-line { display: block; }
.log-box .log-line.ok { color: var(--green); }
.log-box .log-line.err { color: var(--red); }
.log-box .log-line.info { color: var(--blue); }

/* ── DOWNLOAD ── */
#downloadCard { display: none; }
#downloadCard.show { display: block; }

.download-inner {
  text-align: center;
  padding: 12px 0;
}
.apk-icon {
  font-size: 52px;
  margin-bottom: 16px;
  display: block;
  filter: drop-shadow(0 0 20px #00e67650);
}
.download-inner h3 {
  font-size: 22px;
  font-weight: 800;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.download-inner p { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }

.btn-download {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #1a3a28;
  color: var(--green);
  border: 1px solid var(--green);
  border-radius: 10px;
  padding: 14px 32px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: 1px;
}
.btn-download:hover {
  background: var(--green-dim);
  box-shadow: 0 0 24px #00e67630;
  transform: translateY(-2px);
}

.btn-new {
  display: block;
  margin: 16px auto 0;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: 1px;
}
.btn-new:hover { border-color: var(--border-hover); color: var(--text); }

/* ── FOOTER ── */
footer {
  text-align: center;
  padding: 32px 0 0;
  border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 1px;
}
footer a { color: var(--green); text-decoration: none; }

/* ── TIMER ── */
#timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  margin-top: 12px;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── ANIM ── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(16px); }
  to   { opacity:1; transform:translateY(0); }
}
.card { animation: fadeUp .4s ease both; }
.card:nth-child(2) { animation-delay:.1s; }
.card:nth-child(3) { animation-delay:.2s; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <span class="bracket">[</span><span class="name">html</span><span class="arrow">→</span><span class="name">apk</span><span class="bracket">]</span>
    </div>
    <div class="badge">by GusmaoCoder</div>
  </header>

  <div class="hero">
    <h1>Cole seu HTML.<br><span>Receba um APK.</span></h1>
    <p>Converta qualquer página HTML em um aplicativo Android instalável, automaticamente via GitHub Actions.</p>
  </div>

  <div class="config-toggle" id="configToggle" onclick="toggleConfig()">
    <span class="arrow-icon">▶</span>
    <span>⚙ Configuração do GitHub</span>
  </div>

  <div class="config-panel" id="configPanel">
    <div class="field">
      <label>GitHub Token (ghp_...)</label>
      <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    </div>
    <div class="field">
      <label>Usuário do GitHub</label>
      <input type="text" id="ghUser" placeholder="seu-usuario">
    </div>
    <div class="field">
      <label>Nome do Template Repo</label>
      <input type="text" id="ghTemplate" placeholder="html-to-apk-template" value="html-to-apk-template">
    </div>
    <div class="field" style="display:flex;align-items:flex-end;">
      <button class="btn-generate" style="margin:0;font-size:12px;padding:12px;" onclick="saveConfig()">SALVAR CONFIG</button>
    </div>
  </div>

  <div class="card" id="formCard">
    <div class="card-label">Novo App</div>

    <div class="field">
      <label>Nome do Aplicativo</label>
      <input type="text" id="appName" placeholder="Ex: Calculadora Gospel, Devocional Diário...">
    </div>

    <div class="field">
      <label>Código HTML do App</label>
      <div class="editor-wrap">
        <div class="editor-bar">
          <div class="dot-r"></div>
          <div class="dot-y"></div>
          <div class="dot-g"></div>
          <span class="editor-filename">index.html</span>
        </div>
        <textarea id="htmlCode" spellcheck="false" placeholder="<!DOCTYPE html>
<html lang=&quot;pt-BR&quot;>
<head>
  <meta charset=&quot;UTF-8&quot;>
  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
  <title>Meu App</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; }
    h1 { color: #00e676; }
  </style>
</head>
<body>
  <h1>Olá Mundo! 🚀</h1>
  <p>Cole seu HTML aqui...</p>
</body>
</html>"></textarea>
      </div>
    </div>

    <button class="btn-generate"
